[project]
name = "educore"
version = "0.1.0"
description = "EduCore - local-first educational document processing assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "orjson>=3.10",
    "keyring>=25.5",
]

[project.optional-dependencies]
# Heavy processing dependencies are added as their phases land, so that P0
# can be verified without pulling multi-hundred-megabyte wheels.
documents = [
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "jieba>=0.42",
    "pillow>=10.4",
]
retrieval = [
    "lancedb>=0.17",
    "pyarrow>=17",
]
agent = [
    "pydantic-ai-slim[openai]>=0.0.20",
]
artifacts = [
    "python-docx>=1.1",
    "docxtpl>=0.19",
]
watch = [
    "watchdog>=5.0",
]
export-pdf = [
    "playwright>=1.48",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "reportlab>=4.2",
]
packaging = [
    "pyinstaller>=6.10",
]

[tool.uv]
package = true
# 2026.11.24 was published without a win_amd64 wheel (only win32), which breaks
# installation on this target. Constrain to the previous release.
constraint-dependencies = ["regex<2026.11.24"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["frontend", "node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
