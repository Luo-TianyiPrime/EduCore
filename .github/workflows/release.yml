name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --all-extras --locked
      - name: Build executable
        run: uv run pyinstaller packaging/educore.spec --noconfirm --clean --distpath dist --workpath build/pyinstaller
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\educore.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: EduCore-Windows
          path: |
            dist/EduCore/**
            dist/installer/*.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --all-extras --locked
      - name: Build app bundle
        run: uv run pyinstaller packaging/educore.spec --noconfirm --clean --distpath dist --workpath build/pyinstaller
      - name: Package DMG (unsigned)
        run: |
          hdiutil create -volname EduCore -srcfolder dist/EduCore.app -ov -format UDZO dist/EduCore.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: EduCore-macOS-unsigned
          path: dist/EduCore.dmg